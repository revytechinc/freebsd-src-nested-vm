#
# CloudBSD base package repository.
#
# This system's base system packages (CloudBSD-*) are published here.  The
# stock /etc/pkg/FreeBSD.conf is left untouched, so the FreeBSD ports
# repository continues to work exactly as it does on stock FreeBSD.
#
# To disable this repository, instead of modifying or removing this file,
# create or edit /usr/local/etc/pkg/repos/CloudBSD.conf, e.g.:
#
#   mkdir -p /usr/local/etc/pkg/repos
#   echo "CloudBSD: { enabled: no }" >> /usr/local/etc/pkg/repos/CloudBSD.conf
#
# WARNING: CloudBSD ships experimental, unaudited nested-virtualisation
# hypervisor code.  It is not for production systems.
#

CloudBSD: {
  url: "https://nested.cloudbsd.cat/pkg/${ABI}/latest",
  mirror_type: "none",
  enabled: yes,
  priority: 10
}
