# Network pkgbase repository used by bsdinstall(8) on CloudBSD installation
# media.  Installed as /usr/share/bsdinstall/FreeBSD-base.conf via
# PKGBASE_REPO_CONF; the repository identifier must stay "FreeBSD-base"
# because bsdinstall(8) refers to it by that name.
#
# This is the full CloudBSD base system repository.  The separate
# https://nested.cloudbsd.cat/pkg repository is the nested-virt overlay for
# stock FreeBSD systems and does NOT contain a full base system, so it
# cannot be used to install from.
FreeBSD-base: {
  url: "https://nested.cloudbsd.cat/pkgbase/${ABI}/latest",
  mirror_type: "none",
  enabled: yes
}
