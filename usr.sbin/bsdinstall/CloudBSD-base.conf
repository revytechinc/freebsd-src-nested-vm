# Network pkgbase repository used by bsdinstall(8) on CloudBSD installation
# media.  Installed as /usr/share/bsdinstall/FreeBSD-base.conf via
# PKGBASE_REPO_CONF; the repository identifier must stay "FreeBSD-base"
# because bsdinstall(8) refers to it by that name.
FreeBSD-base: {
  url: "https://nested.cloudbsd.cat/pkg/${ABI}/latest",
  mirror_type: "none",
  enabled: yes
}
